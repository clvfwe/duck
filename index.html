<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>duck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 화면 전체 3D 장면 + 모서리에 떠 있는 작은 카드 */
:root{
  --sky:#e4f2f7;
  --card:rgba(255,252,242,.9);
  --ink:#3b3a2c;
  --ink-soft:#6c6a52;
  --leaf:#5f9e3a;
  --beak:#f2a93b;
  --font-display:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
.tilt{position:fixed;left:0;right:0;pointer-events:none;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tilt.top{top:0;height:30%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.tilt.bot{bottom:0;height:20%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.grade{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 58%,transparent 50%,rgba(30,50,15,.28) 100%),linear-gradient(rgba(255,236,190,.10),rgba(255,236,190,0) 40%)}
.card{background:var(--card);border-radius:18px;box-shadow:0 6px 20px rgba(50,70,30,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.title{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  padding:12px 16px 12px 14px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.title .dot{width:34px;height:34px;flex:none;border-radius:50%;background:#fffdf6;border:3px solid var(--beak);position:relative}
.title .dot::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ink);top:9px;left:16px}
.title h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.45rem;line-height:1.1}
.title p{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px;width:max-content;max-width:calc(100vw - 32px)}
.dock .hint{font-size:.86rem;color:var(--ink-soft);padding:0 8px;text-align:center}
.dock button{font-family:var(--font-display);font-size:1rem;color:var(--ink);background:#fff;border:2px solid #e7dfbf;border-radius:999px;
  padding:8px 14px;cursor:pointer;transition:transform .12s ease,background .12s}
.dock button:hover{background:#fff8de}
.dock button:active{transform:scale(.95)}
.dock button:disabled{opacity:.5;cursor:default}
.dock button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.dock button b{font-weight:400;color:var(--beak)}
@media (max-width:520px){.dock .hint{width:100%}.title p{display:none}}
</style>
</head>
<body>


<canvas id="scene" aria-label="풀숲과 작은 호수가 있는 들판에서 하얀 오리 가족이 걸어다니는 3D 장면"></canvas>
<div class="tilt top"></div><div class="tilt bot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
setTimeout(function(){
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth,innerHeight) < 700;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY = 0xe4f2f7;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 26, 75);
const SUN_DIR = new THREE.Vector3(14,24,9).normalize();
const skyMat = new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{uSun:{value:SUN_DIR}},
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);vec4 p=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*p;}`,
  fragmentShader:`uniform vec3 uSun;varying vec3 vD;void main(){
    float h=clamp(vD.y,0.0,1.0);
    vec3 hor=vec3(0.894,0.949,0.969), mid=vec3(0.62,0.82,0.95), top=vec3(0.30,0.60,0.92);
    vec3 c=mix(hor,mid,smoothstep(0.0,0.25,h)); c=mix(c,top,smoothstep(0.25,0.9,h));
    float s=max(dot(normalize(vD),uSun),0.0); c+=vec3(1.0,0.93,0.78)*(pow(s,8.0)*0.25+pow(s,400.0)*1.5);
    gl_FragColor=vec4(c,1.0);}`});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(150,32,16), skyMat); skyDome.renderOrder=-1; scene.add(skyDome);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xe3f3ff, 0x9cbf74, 1.0)); scene.add(new THREE.AmbientLight(0xffffff,0.28));
const sun = new THREE.DirectionalLight(0xfff2d8, 0.5);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:70});
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(14,24,9);

// ---------- 노이즈 ----------
function hash(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);}
function vn(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const fbm=(x,z)=>(vn(x,z)*0.5+vn(x*2.1,z*2.1)*0.25+vn(x*4.3,z*4.3)*0.125)/0.875;
const smooth=(a,b,x)=>{let t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const rand=(a,b)=>a+Math.random()*(b-a);

// ---------- 지형 ----------
const LX=6, LZ=-2, LR=6, BOUND=20;
const lakeDist=(x,z)=>Math.hypot(x-LX,z-LZ);
function H(x,z){
  let h = 0.45 + 1.6*fbm(x*0.05+3.1, z*0.05+7.7) - 0.5;
  h += 4.2*smooth(16,36,Math.hypot(x+2,z+1)) * (0.6+0.6*fbm(x*0.08,z*0.08));
  const k = smooth(LR+2.4, LR-1.6, lakeDist(x,z));
  return h - k*(h+1.0);
}
const dirtAt=(x,z)=>smooth(0.6,0.7,fbm(x*0.11+20,z*0.11-4));

// 바닥 질감 (흑백 얼룩 → 정점 색과 곱함)
const groundTex=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#dcdcdc';g.fillRect(0,0,512,512);
  for(let i=0;i<260;i++){const l=Math.floor(rand(200,250));g.fillStyle=`rgba(${l},${l},${l},${rand(0.08,0.2)})`;g.beginPath();g.ellipse(rand(0,512),rand(0,512),rand(20,60),rand(12,40),rand(0,3),0,7);g.fill();}
  g.lineCap='round';
  for(let i=0;i<9000;i++){const x=rand(0,512),y=rand(0,512),len=rand(3,9),a=-Math.PI/2+rand(-0.5,0.5),l=Math.random()<0.4?Math.floor(rand(230,245)):Math.floor(rand(180,210));
    g.strokeStyle=`rgba(${l},${l},${l},${rand(0.25,0.6)})`;g.lineWidth=rand(0.8,1.8);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(26,26);t.anisotropy=8;return t;})();

const terrGeo=new THREE.PlaneGeometry(100,100,220,220); terrGeo.rotateX(-Math.PI/2);
{
  const pos=terrGeo.attributes.position, cols=[], c=new THREE.Color();
  const sandDeep=new THREE.Color(0xa49d76), sand=new THREE.Color(0xd9c99a), dirt=new THREE.Color(0x9a7f5a), g1=new THREE.Color(0x5c9e32), g2=new THREE.Color(0x76b33e);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=H(x,z); pos.setY(i,h);
    if(h<0.02) c.copy(sand).lerp(sandDeep,Math.min(1,-h));
    else { c.copy(g1).lerp(g2,fbm(x*0.12,z*0.12)); if(h<0.35) c.lerp(sand,1-(h-0.02)/0.33); }
    cols.push(c.r,c.g,c.b);
  }
  terrGeo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); terrGeo.computeVertexNormals();
}
const terrain=new THREE.Mesh(terrGeo,new THREE.MeshStandardMaterial({map:groundTex,vertexColors:true,roughness:1}));
terrain.receiveShadow=true; scene.add(terrain);

// ---------- 물 ----------
const waterU={uTime:{value:0},uSun:{value:SUN_DIR},uFogColor:{value:new THREE.Color(SKY)},uFogNear:{value:26},uFogFar:{value:75}};
const waterGeo=new THREE.PlaneGeometry((LR+3.4)*2,(LR+3.4)*2,140,140); waterGeo.rotateX(-Math.PI/2);
{const p=waterGeo.attributes.position,dep=[];for(let i=0;i<p.count;i++)dep.push(-H(p.getX(i)+LX,p.getZ(i)+LZ));waterGeo.setAttribute('depth',new THREE.Float32BufferAttribute(dep,1));}
const water=new THREE.Mesh(waterGeo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:waterU,
  vertexShader:`attribute float depth;varying float vDepth;varying vec3 vW;varying float vF;
    void main(){vDepth=depth;vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;vec4 mv=viewMatrix*w;vF=-mv.z;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform float uTime,uFogNear,uFogFar;uniform vec3 uSun,uFogColor;varying float vDepth;varying vec3 vW;varying float vF;
    vec2 wave(vec2 p,vec2 d,float f,float sp,float a){float ph=dot(p,d)*f+uTime*sp;return d*cos(ph)*f*a;}
    void main(){
      if(vDepth<0.0)discard;
      vec2 p=vW.xz; vec2 g=wave(p,normalize(vec2(1.0,0.3)),1.7,1.3,0.035)+wave(p,normalize(vec2(-0.4,1.0)),2.6,1.9,0.022)
        +wave(p,normalize(vec2(0.7,-0.8)),4.3,2.6,0.012)+wave(p,normalize(vec2(-1.0,-0.2)),7.1,3.3,0.006);
      vec3 N=normalize(vec3(-g.x,1.0,-g.y)); vec3 V=normalize(cameraPosition-vW);
      float fres=0.04+0.96*pow(1.0-max(dot(N,V),0.0),5.0);
      float d=clamp(vDepth/1.0,0.0,1.0);
      vec3 shallow=vec3(0.55,0.90,0.86), deep=vec3(0.16,0.55,0.72), skyc=vec3(0.78,0.90,0.98);
      vec3 col=mix(shallow,deep,smoothstep(0.05,0.9,d));
      vec2 cp=p*1.6+g*6.0; float ca=abs(sin(cp.x+uTime*0.7)*sin(cp.y*1.1-uTime*0.6))+abs(sin(cp.x*0.7-cp.y*1.3+uTime*0.9));
      float caust=pow(clamp(1.0-ca*0.55,0.0,1.0),6.0)*(1.0-smoothstep(0.2,0.9,d));
      col+=vec3(0.9,1.0,0.95)*caust*0.45;
      col=mix(col,skyc,fres*0.75);
      vec3 R=reflect(-uSun,N); float spec=pow(max(dot(R,V),0.0),260.0);
      col+=vec3(1.0,0.96,0.88)*spec*2.2;
      float foamLine=1.0-smoothstep(0.0,0.09,vDepth+0.02*sin(p.x*5.0+uTime*1.5)*sin(p.y*4.0-uTime));
      col=mix(col,vec3(1.0),foamLine*0.6);
      float alpha=mix(0.1,0.62,smoothstep(0.0,0.9,d)); alpha=max(alpha,fres*0.8); alpha=max(alpha,caust*0.5); alpha=max(alpha,spec); alpha=max(alpha,foamLine*0.7);
      alpha*=smoothstep(0.0,0.03,vDepth+0.02);
      gl_FragColor=vec4(mix(col,uFogColor,smoothstep(uFogNear,uFogFar,vF)),alpha);}`}));
water.position.set(LX,0.0,LZ); water.renderOrder=2; scene.add(water);

const dummy=new THREE.Object3D(), tmpC=new THREE.Color();

// 연잎
{
  const geo=new THREE.CircleGeometry(0.55,24,0.3,Math.PI*2-0.6).rotateX(-Math.PI/2);
  const mat=new THREE.MeshStandardMaterial({color:0x5f9a3c,roughness:0.6,side:THREE.DoubleSide});
  for(let i=0;i<11;i++){const a=rand(0,6.28),r=rand(1.2,LR-1);const m=new THREE.Mesh(geo,mat);
    m.position.set(LX+Math.cos(a)*r,0.02,LZ+Math.sin(a)*r);m.rotation.y=rand(0,6.28);const s=rand(0.6,1.3);m.scale.set(s,1,s);m.receiveShadow=true;scene.add(m);}
}

// ---------- 바위 (둥글고 이끼 낀) ----------
function rockGeo(seed){
  const g=new THREE.IcosahedronGeometry(1,4), p=g.attributes.position, cols=[], v=new THREE.Vector3(), c=new THREE.Color();
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i).normalize();
    const n=fbm(v.x*1.6+seed+v.y*0.8, v.z*1.6+seed*2+v.y*0.6);
    v.multiplyScalar(0.82+0.35*n); v.y*=0.62; if(v.y<-0.15) v.y=-0.15+(v.y+0.15)*0.3; p.setXYZ(i,v.x,v.y,v.z);
    const moss=smooth(0.15,0.45,v.y)*smooth(0.35,0.6,fbm(v.x*3+seed,v.z*3));
    c.setHSL(0.1,0.06,0.55+0.18*n).lerp(tmpC.setHex(0x6f9a3a),moss*0.85); cols.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); g.computeVertexNormals(); return g;
}
const rockGeos=[0,5,11,17].map(rockGeo), rockMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.92});
const rocks=[];
function placeRock(x,z,s){const sx=rand(0.9,1.3),sz=rand(0.8,1.2),r=s*Math.max(sx,sz)*1.12;
  // 바위끼리 붙어서 오리가 갇히는 틈이 생기지 않게 간격 유지
  if(rocks.some(o=>Math.hypot(x-o.x,z-o.z)<r+o.r+1.6))return;
  const m=new THREE.Mesh(rockGeos[Math.floor(Math.random()*4)],rockMat);
  m.position.set(x,H(x,z)-0.05*s,z);m.rotation.y=rand(0,6.28);m.scale.set(s*sx,s,s*sz);m.castShadow=m.receiveShadow=true;scene.add(m);rocks.push({x,z,r});}
for(let i=0;i<22;i++){const x=rand(-BOUND,BOUND),z=rand(-BOUND,BOUND);if(lakeDist(x,z)<LR+2||Math.hypot(x+6,z-6)<3)continue;placeRock(x,z,rand(0.3,1.6));}
for(let i=0;i<10;i++){const a=rand(0,6.28),r=rand(LR+0.6,LR+1.8);placeRock(LX+Math.cos(a)*r,LZ+Math.sin(a)*r,rand(0.25,0.9));}
const onRock=(x,z)=>rocks.some(r=>Math.hypot(x-r.x,z-r.z)<r.r);

// 조약돌
{
  const n=160, im=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.2,2),new THREE.MeshStandardMaterial({roughness:0.85}),n);
  for(let i=0;i<n;i++){const a=rand(0,6.28),r=rand(LR-0.6,LR+1.4),x=LX+Math.cos(a)*r,z=LZ+Math.sin(a)*r;
    dummy.position.set(x,Math.max(H(x,z),-0.15)+0.03,z);dummy.rotation.set(rand(0,1),rand(0,6),0);const s=rand(0.4,1.3);dummy.scale.set(s,s*0.5,s*rand(0.7,1.2));
    dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix);im.setColorAt(i,tmpC.setHSL(0.1,0.06,rand(0.62,0.88)));}
  im.castShadow=im.receiveShadow=true;scene.add(im);
}

// ---------- 풀 ----------
const timeU={value:0};
function bladeGeo(){const seg=5,pos=[],col=[],nor=[],idx=[];
  for(let i=0;i<=seg;i++){const t=i/seg,w=0.5*Math.pow(1-t,0.8),bz=0.28*t*t,c=0.94+0.08*t;
    pos.push(-w,t,bz,w,t,bz);col.push(c,c,c*0.92,c,c,c*0.92);nor.push(0,0,1,0,0,1);}
  for(let i=0;i<seg;i++){const a=2*i;idx.push(a,a+1,a+3,a,a+3,a+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);return g;}
function grassMat(amp){
  const m=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.75,side:THREE.DoubleSide});
  m.onBeforeCompile=sh=>{sh.uniforms.uTime=timeU;
    sh.vertexShader='uniform float uTime;\n'+sh.vertexShader
      .replace('#include <beginnormal_vertex>','vec3 objectNormal = vec3(0.0,1.0,0.25);')
      .replace('#include <begin_vertex>',`vec3 transformed = vec3(position);
        float ph = instanceMatrix[3].x*0.45 + instanceMatrix[3].z*0.31;
        float b = position.y*position.y;
        transformed.z += (sin(uTime*1.7+ph)*0.6+sin(uTime*3.1+ph*2.0)*0.25)*${amp.toFixed(2)}*b;`);};
  return m;
}
const BLADE=bladeGeo();
{
  const n=small?55000:130000, im=new THREE.InstancedMesh(BLADE,grassMat(0.22),n); let i=0, guard=0;
  while(i<n && guard<n*6){guard++;
    const x=rand(-30,30), z=rand(-30,30), h=H(x,z);
    if(h<0.22 || Math.hypot(x,z)>34) continue;
    const dd=0; if(onRock(x,z)) continue;
    const far=Math.hypot(x+2,z+1)>24; if(far && Math.random()<0.35) continue;
    dummy.position.set(x,h-0.04,z); dummy.rotation.set(rand(-0.2,0.2),rand(0,6.28),rand(-0.2,0.2));
    const tall=rand(0.22,0.42)*(Math.random()<0.05?1.6:1);
    dummy.scale.set(rand(0.07,0.11),tall,tall); dummy.updateMatrix(); im.setMatrixAt(i,dummy.matrix);
    im.setColorAt(i,tmpC.setHSL(rand(0.23,0.27),rand(0.52,0.62),rand(0.38,0.46))); i++;
  }
  im.count=i; scene.add(im);
}
// 물가 갈대
{
  const n=520, im=new THREE.InstancedMesh(BLADE,grassMat(0.12),n);
  for(let i=0;i<n;i++){const a=rand(0,6.28),r=LR+rand(0.4,2.6)*(Math.random()<0.7?1:0.4),x=LX+Math.cos(a)*r,z=LZ+Math.sin(a)*r;
    dummy.position.set(x,Math.max(H(x,z),-0.2),z);dummy.rotation.set(rand(-0.12,0.12),rand(0,6.28),rand(-0.12,0.12));
    const t=rand(1.0,2.4);dummy.scale.set(rand(0.07,0.11),t,t*0.5);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix);
    im.setColorAt(i,tmpC.setHSL(rand(0.2,0.25),0.45,rand(0.3,0.42)));}
  scene.add(im);
  const cat=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.06,0.06,0.32,8),new THREE.MeshStandardMaterial({color:0x6b4a2b,roughness:0.9}),26);
  const st=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.012,0.015,1,4).translate(0,0.5,0),new THREE.MeshStandardMaterial({color:0x5f8a3a}),26);
  for(let i=0;i<26;i++){const a=rand(0,6.28),r=LR+rand(0.3,1.6),x=LX+Math.cos(a)*r,z=LZ+Math.sin(a)*r,y=Math.max(H(x,z),-0.2),h=rand(1.6,2.4);

  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=dist;moved=99;}});
canvas.addEventListener('pointermove',e=>{const pr=ptrs.get(e.pointerId);if(!pr)return;const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;
  if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>6){yaw-=dx*0.006;pitch=Math.min(1.3,Math.max(0.08,pitch+dy*0.004));}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()],pd=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)dist=Math.min(32,Math.max(3.5,dist0*pinch0/pd));}});
function up(e){if(ptrs.size===1&&moved<=6&&ptrs.has(e.pointerId))click(e);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(32,Math.max(3.5,dist*(1+e.deltaY*0.001)));},{passive:false});
function click(e){
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hd=ray.intersectObjects(pickables,false)[0];if(hd){quack(hd.object.userData.duck);return;}
  const hits=ray.intersectObjects([water,terrain],false);if(!hits.length)return;
  const pt=hits[0].point;if(!inBounds(pt.x,pt.z))return;
  const now=performance.now(),dbl=now-(click.last||0)<320;click.last=now;
  clearOfRocks(mama.target.set(pt.x,0,pt.z));mama.mode='walk';mama.user=true;mama.run=dbl||Math.hypot(pt.x-mama.g.position.x,pt.z-mama.g.position.z)>12;
  marker.position.set(mama.target.x,Math.max(H(mama.target.x,mama.target.z),0)+0.06,mama.target.z);marker.visible=true;markT=0;
}
const rt = renderer.capabilities.isWebGL2 ? new THREE.WebGLMultisampleRenderTarget(innerWidth,innerHeight,{format:THREE.RGBAFormat}) : undefined;
const composer = new THREE.EffectComposer(renderer, rt);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2), 0.2, 0.6, 0.985);
composer.addPass(bloom);
composer.addPass(new THREE.ShaderPass({uniforms:{tDiffuse:{value:null}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;
    float l=dot(c,vec3(0.299,0.587,0.114)); c=mix(vec3(l),c,1.12); c=c*vec3(1.03,1.01,0.97)+vec3(0.01,0.008,0.0);
    float v=smoothstep(1.05,0.35,length(vUv-vec2(0.5,0.55))); c*=mix(0.8,1.0,v);
    gl_FragColor=vec4(c,1.0);}`}));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setPixelRatio(Math.min(devicePixelRatio,2));composer.setSize(w,h);bloom.setSize(w/2,h/2);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock(),tv=new THREE.Vector3();
function frame(){
  const dt=Math.min(0.05,clock.getDelta()),t=clock.elapsedTime;
  timeU.value=reduce?t*0.3:t;
  updateMama(dt);babies.forEach((b,i)=>updateBaby(b,i?babies[i-1]:mama,dt));
  ducks.forEach(d=>animateDuck(d,dt,t));
  butterflies.forEach(b=>{b.a+=dt*b.sp;const x=b.cx+Math.cos(b.a)*b.rad,z=b.cz+Math.sin(b.a*1.3)*b.rad;
    b.g.position.set(x,H(x,z)+1.1+Math.sin(t*2+b.a*5)*0.35,z);b.g.rotation.y=b.a*1.1;const f=Math.sin(t*18+b.cx)*1.1;b.l.rotation.z=f;b.r.rotation.z=-f;});
  if(marker.visible){markT+=dt;
    const w=Math.min(1,markT/0.6); mWave.scale.setScalar(0.3+w*0.9); mWave.material.opacity=0.7*(1-w);
    const k=markT<0.25?1-Math.pow(1-markT/0.25,3):1; mRing.scale.setScalar(0.6+0.4*k+0.04*Math.sin(t*3)); mRing.material.opacity=0.75*k;
    mDot.scale.setScalar(k);}
  ripples.forEach(m=>{if(!m.visible)return;m.userData.t+=dt;const u=m.userData.t/1.6;if(u>=1){m.visible=false;return;}
    const s=m.userData.s*(0.3+u*1.4);m.scale.set(s,1,s);m.material.opacity=0.55*(1-u);});
  camT.lerp(tv.set(mama.g.position.x,Math.max(mama.g.position.y,0)+0.9,mama.g.position.z),Math.min(1,dt*2.5));
  camera.position.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dist,camT.y+Math.sin(pitch)*dist,camT.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  const floor=Math.max(H(camera.position.x,camera.position.z),0)+0.5;if(camera.position.y<floor)camera.position.y=floor;
  camera.lookAt(camT);
  sun.position.copy(camT).add(SUN_OFF);sun.target.position.copy(camT);G.light.value.copy(SUN_OFF).normalize();
  waterU.uTime.value=t; skyDome.position.copy(camera.position);
  composer.render();requestAnimationFrame(frame);
}
frame();
},30);
</script>
